name: KU seat watcher

on:
  schedule:
    - cron: "0 * * * *"     # starts a run every hour; each run checks for ~55 min
  workflow_dispatch:         # lets you start it by hand with "Run workflow"

permissions:
  contents: write            # lets the watcher publish live data for the dashboard

concurrency:
  group: seat-watcher        # never run two at once
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Get dashboard data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null; then
            git clone -q --depth 1 --branch data "$URL" data
          else
            mkdir data && cd data
            git init -q -b data
            git remote add origin "$URL"
          fi
          cd "$GITHUB_WORKSPACE/data"
          git config user.name "seat-watcher"
          git config user.email "seat-watcher@users.noreply.github.com"

      - name: Watch seats for 55 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_DIR: data
        run: python -u banner_seat_watcher.py --minutes 55
